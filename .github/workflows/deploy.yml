name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: test-publish-data-protos-webflux
  REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon
        env:
          # Needed to resolve com.github.subhajitdas298:test-data-protos from
          # GitHub Packages, which requires authentication even for public repos.
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}

      - name: Build and push image
        run: |
          IMAGE="${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:latest" .
          docker push "$IMAGE"
          docker push "${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:latest"

      - name: Deploy new image to Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image "${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
